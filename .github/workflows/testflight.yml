name: TestFlight
on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'Packages/**'
      - 'Vendor/**'
      - 'EnglishTrainer.xcodeproj/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'project.yml'
      - 'Scripts/build-device.sh'
      - 'Scripts/testflight.sh'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    environment: ios-testflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package tests
        run: swift test --package-path Packages/VoiceLearning
      - name: Archive, cloud-sign and upload
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash Scripts/testflight.sh --upload
      - name: Retain crash symbols for support
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EnglishTrainer-dSYMs-run${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/EnglishTrainer-dSYMs-run${{ github.run_number }}-${{ github.run_attempt }}.zip
          if-no-files-found: error
          retention-days: 7
