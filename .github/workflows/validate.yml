name: Validate
on:
  pull_request:
    paths-ignore: ['Docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash Scripts/test.sh
  ios:
    needs: core
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package tests on macOS
        run: swift test --package-path Packages/VoiceLearning
      - name: Build and analyze iOS Simulator app without signing
        run: >-
          xcodebuild -project EnglishTrainer.xcodeproj -scheme EnglishTrainer
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build analyze
