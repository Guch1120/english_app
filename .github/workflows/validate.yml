name: Validate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tts_smoke:
        description: Download curated TTS models and synthesize the fixed public test sentence on Apple Silicon
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select required build checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 Scripts/ci/changes.py
      - name: Check workflow policy, shell scripts and credential leaks in Docker
        run: bash Scripts/quality.sh
  core:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash Scripts/test.sh
  ios:
    needs: [quality, core]
    if: needs.quality.outputs.build == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start iPhone Simulator boot while macOS package tests run
        run: bash Scripts/ci/simulator-startup-smoke.sh --boot-only
      - name: Package tests on macOS
        env:
          VOICELEARNING_TTS_SMOKE: ${{ inputs.tts_smoke == true && '1' || '0' }}
          TTS_SMOKE_OUTPUT: ${{ runner.temp }}/tts-smoke
        run: swift test --package-path Packages/VoiceLearning
      - name: Build and analyze iOS Simulator app without signing
        run: >-
          xcodebuild -project EnglishTrainer.xcodeproj -scheme EnglishTrainer
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build analyze
      - name: Launch app in iPhone Simulator and verify single initialization
        run: bash Scripts/ci/simulator-startup-smoke.sh build/Build/Products/Debug-iphonesimulator/EnglishTrainer.app
      - name: Exercise learning persistence and navigation in iPhone Simulator
        run: >-
          xcodebuild test -project EnglishTrainer.xcodeproj -scheme EnglishTrainer
          -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_UDID}"
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64
      - name: Verify unsigned distribution archive without secrets
        run: bash Scripts/testflight.sh --archive-only
      - name: Keep public-sentence TTS smoke samples
        if: inputs.tts_smoke == true && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tts-smoke-public-sentence
          path: ${{ runner.temp }}/tts-smoke
          retention-days: 3
          if-no-files-found: error
  review-gate:
    if: always()
    needs: [quality, core, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and require every applicable check
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD_REQUIRED: ${{ needs.quality.outputs.build }}
          CORE: ${{ needs.core.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          {
            printf '## Automated PR checks\n\n'
            printf '| Check | Result |\n|---|---|\n'
            printf '| Security policy, linters, secret scan | %s |\n' "$QUALITY"
            printf '| Swift tests | %s |\n' "$CORE"
            printf '| Simulator + unsigned archive | %s |\n' "$IOS"
            printf '\nThis gate does not certify model behavior, audio quality, device UX or cloud-signing permissions.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$QUALITY" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$CORE" = success
            test "$IOS" = success
          else
            test "$BUILD_REQUIRED" = false
            test "$CORE" = skipped
            test "$IOS" = skipped
          fi
